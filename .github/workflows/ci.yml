name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.85
      with:
        components: clippy

    - name: Check
      run: cargo check --workspace

    - name: Test
      run: cargo test --workspace

    - name: Clippy
      run: cargo clippy --workspace -- -D warnings