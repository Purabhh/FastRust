[workspace]
members = [
    "rust_squared",
    "rust_squared_macros",
    "cargo-rsq",
    "examples/hello_world",
    "examples/rest_api",
    "examples/with_auth",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
bytes = "1.9"
futures-util = "0.3"
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
percent-encoding = "2.3"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
